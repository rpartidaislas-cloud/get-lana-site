<div class="beta-overlay" id="betaOverlay" hidden>
    <section class="beta-dialog" role="dialog" aria-modal="true" aria-labelledby="betaDialogTitle" aria-describedby="betaDialogIntro">
      <header class="beta-dialog-head">
        <div><div class="beta-dialog-kicker" id="betaDialogKicker">LANA Chat IA Beta</div><h2 id="betaDialogTitle">Reserva uno de los 20 lugares</h2><p class="beta-dialog-intro" id="betaDialogIntro">Cuéntanos quién usará LANA. Al continuar te llevaremos al pago seguro de Stripe.</p></div>
        <button class="beta-close" id="betaClose" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <form class="beta-form" id="betaForm" novalidate>
        <div class="beta-form-grid">
          <div class="beta-field"><label for="betaContact">Nombre del contacto</label><input id="betaContact" name="nombre_contacto" autocomplete="name" maxlength="100" required></div>
          <div class="beta-field"><label for="betaBusiness">Nombre del negocio</label><input id="betaBusiness" name="nombre_negocio" autocomplete="organization" maxlength="140" required></div>
          <div class="beta-field"><label for="betaEmail">Correo electrónico</label><input id="betaEmail" name="email" type="email" autocomplete="email" maxlength="180" required><small>Será el correo de acceso a LANA.</small></div>
          <div class="beta-field"><label for="betaWhatsapp">WhatsApp</label><input id="betaWhatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="33 1234 5678" aria-describedby="betaWhatsappHelp" required><small id="betaWhatsappHelp">Si estás en México puedes escribir los 10 dígitos; agregaremos +52 automáticamente.</small></div>
          <div class="beta-field"><label for="betaCity">Ciudad</label><input id="betaCity" name="ciudad" autocomplete="address-level2" maxlength="100"></div>
          <div class="beta-field"><label for="betaCountry">País</label><input id="betaCountry" name="pais" autocomplete="country-name" maxlength="80" value="México"></div>
          <div class="beta-field is-wide"><label for="betaBusinessType">Tipo de negocio</label><select id="betaBusinessType" name="tipo_negocio"><option value="">Selecciona una opción</option><option>Taller de bordado</option><option>Artículos promocionales</option><option>Uniformes y ropa empresarial</option><option>Impresión y personalización</option><option>Agencia o distribuidor</option><option>Otro</option></select></div>
          <fieldset class="beta-channels"><legend>Canales que utilizas actualmente</legend><div class="beta-channel-options"><label><input type="checkbox" name="canales" value="whatsapp">WhatsApp</label><label><input type="checkbox" name="canales" value="instagram">Instagram</label><label><input type="checkbox" name="canales" value="messenger">Messenger</label><label><input type="checkbox" name="canales" value="sitio_web">Sitio web</label><label><input type="checkbox" name="canales" value="mostrador">Mostrador</label></div></fieldset>
          <div class="beta-field is-wide"><label for="betaChallenge">¿Qué te gustaría resolver primero con LANA?</label><textarea id="betaChallenge" name="reto_principal" maxlength="800" placeholder="Por ejemplo: responder más rápido, cotizar sin errores o dar seguimiento a cada prospecto."></textarea></div>
          <div class="beta-honeypot" aria-hidden="true"><label for="betaWebsite">Sitio</label><input id="betaWebsite" name="website" tabindex="-1" autocomplete="off"></div>
        </div>
        <label class="beta-consent"><input id="betaPrivacy" name="privacidad_aceptada" type="checkbox" required><span>Acepto el tratamiento descrito en el <a href="privacidad.html#programa-beta" target="_blank" rel="noopener">aviso de privacidad</a> para gestionar mi solicitud, contactarme sobre LANA y, si decido contratar, procesar el pago seguro con Stripe, habilitar mi acceso y brindarme soporte.</span></label>
        <div class="beta-form-error" id="betaFormError" role="alert" aria-live="assertive"></div>
        <div class="beta-form-actions"><button class="lbtn" id="betaCancel" type="button">Cancelar</button><button class="lbtn button-primary" id="betaSubmit" type="submit">Continuar al pago</button></div>
      </form>
    </section>
  </div>
